[package]
name = "phi-cap"
version = "0.1.0"
edition = "2024"
description = "Capability vocabulary for the phi family: one declaration language, one decision vocabulary"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-cap"
readme = "README.md"
keywords = ["agent", "capability", "codeact"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]
